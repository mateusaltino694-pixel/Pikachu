<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Pokédex🔥</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-image: url("https://wallpapercave.com/wp/wp10311654.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
  </style>
</head>

<body>

  <div class="container mt-5">

    <div class="col-md-6 mx-auto">

      <div class="p-5 bg-white rounded shadow text-center">

        <h1 class="mb-4">Pokédex🔥</h1>

        <div class="mb-4">
          <input
            type="text"
            id="campoBusca"
            placeholder="Nome ou Número"
            class="form-control d-inline-block w-auto">

          <button id="btnBuscar" class="btn btn-primary">
            Buscar
          </button>
        </div>

        <div id="resultado" class="mb-4"></div>

        <div class="d-flex justify-content-center gap-2">

          <button id="btnAnterior" class="btn btn-secondary">
            Anterior
          </button>

          <button id="btnAleatorio" class="btn btn-warning">
            Aleatório
          </button>

          <button id="btnProximo" class="btn btn-secondary">
            Próximo
          </button>

        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
